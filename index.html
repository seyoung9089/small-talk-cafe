<style>
/* Layout: one narrow column like a phone at the counter; chat in the middle, receipt at the end */
:root{
  --bg:#f7f6f3; --surface:#ffffff; --ink:#24201b; --muted:#6f675d; --line:#e4dfd7;
  --accent:#a8641e; --accent-soft:#f3e6d6; --me:#24201b; --me-ink:#fbf8f3;
  --t10:#8c857b; --t30:#3f6fa3; --t60:#2f8a5f; --t100:#b57a10;
  --display:"Bricolage Grotesque", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --body:system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#171512; --surface:#211e1a; --ink:#efe9e1; --muted:#a59c90; --line:#35302a;
  --accent:#e0a458; --accent-soft:#3a2d1f; --me:#efe9e1; --me-ink:#1b1814;
  --t10:#9d958a; --t30:#7fa8d6; --t60:#6cc49a; --t100:#e8b44a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171512; --surface:#211e1a; --ink:#efe9e1; --muted:#a59c90; --line:#35302a;
  --accent:#e0a458; --accent-soft:#3a2d1f; --me:#efe9e1; --me-ink:#1b1814;
  --t10:#9d958a; --t30:#7fa8d6; --t60:#6cc49a; --t100:#e8b44a; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:640px;margin:0 auto;padding-block:20px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:2rem;font-weight:700;letter-spacing:-.01em}
h2{font-size:1.25rem;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 12px;font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* start */
.personas{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.pcard{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px}
.pcard:hover{border-color:var(--accent)}
.pcard .nm{font-family:var(--display);font-weight:700;font-size:1.15rem}
.pcard .role{font-family:var(--mono);font-size:.75rem;color:var(--accent)}
.pcard .ds{font-size:.88rem;color:var(--muted)}
.pcard .say{font-size:.85rem;font-style:italic;border-top:1px dashed var(--line);padding-top:6px}
.panel{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--surface);display:flex;flex-direction:column;gap:10px}
.list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.list li{display:flex;justify-content:space-between;gap:10px;font-size:.9rem}
.list .en{font-weight:600}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* chat */
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.who{display:flex;flex-direction:column}
.steps{display:flex;gap:4px;flex-wrap:wrap}
.steps span{font-family:var(--mono);font-size:.7rem;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.steps span.on{border-color:var(--accent);color:var(--accent);font-weight:600}
.steps span.done{background:var(--accent-soft);border-color:transparent;color:var(--ink)}
.log{display:flex;flex-direction:column;gap:10px;min-height:320px}
.msg{max-width:85%;padding:10px 14px;border-radius:16px;line-height:1.45;min-width:0;overflow-wrap:anywhere}
.msg.b{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.u{align-self:flex-end;background:var(--me);color:var(--me-ink);border-bottom-right-radius:4px}
.msg .spk{border:0;background:none;color:var(--muted);font-size:.75rem;padding:0;margin-left:8px;text-decoration:underline}
.typing{align-self:flex-start;color:var(--muted);font-size:.85rem;font-family:var(--mono)}
.composer{position:sticky;bottom:0;background:var(--bg);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line)}
.composer form{display:flex;gap:8px}
.composer input{flex:1;min-width:0;font:inherit;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.hints{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.hints .note{font-size:.85rem;color:var(--accent)}
.chip{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;border-top:1px dashed var(--line);padding-top:8px}
.chip:first-of-type{border-top:0;padding-top:0}
.chip .t{min-width:0}
.chip .t b{display:block}
.chip .t small{color:var(--muted)}
.chip .acts{display:flex;gap:6px;flex-shrink:0}
.chip .acts button{font-size:.78rem;padding:4px 8px;border-radius:8px;border:1px solid var(--line);background:transparent}

.gl{border:0;background:none;padding:0;font:inherit;color:inherit;cursor:pointer;text-decoration:underline dotted;text-decoration-color:var(--muted);text-underline-offset:3px}
.gl:hover{color:var(--accent)}
[hidden]{display:none!important}
.gl.w{text-decoration:none}
.gl.w:hover,.gl.w.on{text-decoration:underline;text-decoration-color:var(--accent)}
.glbox .sense{line-height:1.45}
.glbox .sense i{color:var(--muted);font-style:normal;margin-right:4px}
.glbox .ex{display:block;color:var(--muted);font-size:.8rem}
.glbox .src{font-size:.72rem;color:var(--muted)}
.glbox{margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--accent-soft);font-size:.88rem;display:flex;flex-direction:column;gap:6px}
.glbox .row{font-size:.78rem}
.glbox button{font-size:.78rem;padding:3px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
.btnlink{font-size:.78rem;padding:4px 8px;border-radius:8px;border:1px solid var(--line);color:var(--ink);text-decoration:none;white-space:nowrap}
/* receipt */
.receipt{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:20px 18px;font-family:var(--mono);font-size:.85rem;display:flex;flex-direction:column;gap:12px;
  -webkit-mask:radial-gradient(circle 6px at 50% 0,#0000 98%,#000) 0 0/14px 100% repeat-x;mask:radial-gradient(circle 6px at 50% 0,#0000 98%,#000) 0 0/14px 100% repeat-x;padding-top:24px}
.receipt .hd{text-align:center;display:flex;flex-direction:column;gap:2px}
.receipt .hd b{font-size:1.05rem;letter-spacing:.1em}
.dash{border-top:1px dashed var(--muted);opacity:.6}
.line{display:flex;flex-direction:column;gap:4px}
.line .top{display:flex;justify-content:space-between;gap:8px}
.line .said{font-family:var(--body);font-size:.9rem;overflow-wrap:anywhere}
.line .tip{font-family:var(--body);font-size:.82rem;color:var(--muted)}
.line .model{font-family:var(--body);font-size:.82rem;border-left:2px solid var(--accent);padding-left:8px}
.tier{font-weight:600;font-variant-numeric:tabular-nums}
.tier.s0{color:var(--t10);opacity:.7}.tier.s10{color:var(--t10)}.tier.s30{color:var(--t30)}.tier.s60{color:var(--t60)}.tier.s100{color:var(--t100)}
.total{display:flex;justify-content:space-between;font-size:1.05rem;font-weight:600}
.legend{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:.8rem}
@media (prefers-reduced-motion: no-preference){.msg{animation:pop .18s ease-out}@keyframes pop{from{transform:translateY(4px);opacity:.4}to{transform:none;opacity:1}}}
.kofrom{display:block;margin-top:4px;font-size:12px;opacity:.8;line-height:1.4}
</style>

function lev(a,b){if(Math.abs(a.length-b.length)>2)return 9;const d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++){d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1)}return d[a.length][b.length]}

/* ---------- scoring rules (see design doc: 10 / 30 / 60 / 100) ---------- */
function wordsOf(n){return (n.match(/[a-z']+/g)||[])}
function scoreTurn(raw,n,stage,lastB){
  const w=wordsOf(n), wc=w.length;
  const polite=/\b(please|can i (get|have)|could i|i'?d like|i would like|thank)/.test(n);
  const connector=/\b(and|because|but|so|actually|just|really|kind of|though|since|also|too|finally|today|this morning)\b/.test(n);
  const added=wc>=6||(connector&&wc>=4)||(!CHAT.has(stage)&&polite);
  const asked=/\?/.test(raw)||QSTART.test(n)||BACK.test(n)||/\b(how about|what about) /.test(n);
  const content=new Set(wordsOf((lastB||'').toLowerCase()).filter(x=>x.length>=5));
  const overlap=w.some(x=>content.has(x));
  const reacted=/\b(oh|nice|cool|wow|really|that'?s|sounds|haha|lol|awesome|no way|love|aw+|ha|great)\b/.test(n)||overlap;
  if(asked&&added&&(reacted||wc>=10))return 100;
  if(asked)return 60;
  if(added)return 30;
  return 10;
}

async function reask(st,raw){
  const p=P[S.pid],pi=pidx(S.pid);

  if(st==='close'){await say(pick(["Anyway, enjoy your drink!","Oh, and your drink's getting cold!","Alright, enjoy!"]));if(!S.best.close)record('close',raw,scoreTurn(raw,norm(raw),st,S.lastB));await advance();return}
  S.reasks[st]=(S.reasks[st]||0)+1;
  if(S.reasks[st]>=3){
    if(!S.best[st])record(st,S.asked[st]||raw,60);
    if(st==='order'){S.slots.drink=S.lastRec||REC[pi];await say("Tell you what, I'll make you my favorite. One "+S.slots.drink+"!")}

    else if(st==='name')await say("I'll just draw a smiley face on the cup!");
    else await say(pick(["Anyway!","Okay, moving on!"]));
    await advance();return;
  }
  if(st==='order'&&S.offer){await say(pick(["So, want to try the "+S.offer+"? Or something else?","Should I make you the "+S.offer+", or do you want something different?"]));return}
  const pre=S.reasks[st]===1?pick(["So, ","Anyway, ","Okay, so "]):pick(["Alright, back to business. ","Sorry, I'm getting distracted! ","Okay, okay. "]);

  const q=alts.length?alts[0]:pick(ALT_SHORT[st]);
  await say(pre+(/[.!] $/.test(pre)?cap(q):q));
}

 {re:/^why (?:do|did|are|is|don'?t|can'?t|would)\b/,r:["Ha, good question! I honestly don't know.","Um, I'm not sure why. Sorry.","No idea.","Because. That's all I've got. Mysterious, right?","Oh, I wonder that myself, dear."]},
 {re:/do you (like|love|enjoy) ([a-z' -]{2,25}?)\??$/,r:["I love {x}! Do you?","Um, yeah, {x} {be} cool.","{X}? Sure.","{X}? Who doesn't!","Oh, I don't know much about {x}, honey, but my grandkids love it."]},
 {re:/have you (ever )?(been to|tried|seen|watched|heard of|heard) ([a-z' -]{2,25}?)\??$/,r:["Not yet! Is it good?","Um, no, not yet. Is it good?","Nope. Good?","Not yet. Should I? Convince me.","Oh, not yet, dear. Tell me about it!"]},

];
function genQ(q){if(!q)return null;const pi=pidx(S.pid);for(const g of GENQ){const m=q.match(g.re);if(m){let x=(m[m.length-1]||'').trim().replace(/^(the|a|an) /,'').replace(/\byour\b/g,'my');if(!x&&!/favou?rite|how|did|were|was|can you|do you|why/.test(g.re.source))continue;if(!x)x='that';const X=x.replace(/\bk-?pop\b/g,'K-pop').replace(/\bk-?dramas?\b/g,'K-dramas');return g.r[pi].replace('{be}',/[a-z]s$/.test(X)&&!/(ss|us|is)$/.test(X)?'are':'is').replace('{x}',X).replace('{X}',cap(X))||g.r[pi].replace('{x}',x).replace('{X}',cap(x))}}return null}
const isNeg=n=>NEG.test(n.replace(/not (too |that |so |really |very )?(bad|busy|tired|stressed|sleepy)/g,''));
const NEUTRAL=["Oh, nice!","Oh, cool.","Nice.","Ha! Fair enough.","Oh, how nice, dear."];
const REJECT=/no thanks|something else|not that|anything else|other options?|i'?ll pass|not really feeling/;

/* ---------- attribute requests ("something not too sweet", "a light drink"...) ---------- */
const NEGPRE=/\b(not|no|haven'?t|hasn'?t|didn'?t|wasn'?t|weren'?t|couldn'?t|can'?t|won'?t|never|without|don'?t (?:want|like|need)|doesn'?t|isn'?t|aren'?t|less|never|hate|dislike|avoid|except|besides|other than|too much)\b(?:\s+\w+){0,3}\s*$/;
function isNegAt(n,re){const m=n.match(re);return !!(m&&NEGPRE.test(n.slice(0,m.index)))}
const ATTRS=[
 {id:'nocaf',re:/caffeine|coffee/,need:'neg',d:'chamomile tea',why:'caffeine-free'},
 {id:'bitter',re:/\bbitter|\bbold\b/,d:'americano',why:'bold and a little bitter',negd:'latte',negwhy:'smooth and not bitter'},
 {id:'spicy',re:/\bspic(y|es)\b|cinnamon/,d:'chai latte',why:'warm and spicy'},
 {id:'healthy',re:/healthy|healthier|detox|low.?cal|vitamin|good for (me|you)/,d:'green tea',why:'light and healthy'},
 {id:'fruity',re:/\bfruit(y|s)?\b|berry|berries|tropical|citrus/,d:'strawberry smoothie',why:'fruity and fresh'},
 {id:'creamy',re:/creamy|milky|foamy|smooth/,d:'latte',why:'smooth and creamy'},
 {id:'cold',re:/\b(cold|iced?|chilled|ice)\b/,d:'ICED',why:'nice and cold'},
 {id:'warm',re:/\b(warm|hot|cozy|cosy|heat(ing)?)\b/,d:'hot chocolate',why:'warm and cozy'},
 {id:'fresh',re:/refreshing|\bfresh\b|\bcool(ing)?\b|summer|thirsty/,d:'lemonade',why:'cool and refreshing'},
 {id:'lsweet',re:/(a (bit|little)|slightly|kind of|somewhat) sweet|sweet but not too (much|sweet)/,d:'vanilla latte',why:'a little sweet, but not too sweet'},
 {id:'sweet',re:/\bsweet(er|est)?\b|sugary|dessert.?like/,d:'caramel macchiato',why:'sweet and creamy',negd:'latte',negwhy:'creamy but not sweet'},
 {id:'strong',re:/\bstrong(er|est)?\b|intense|kick|wake me up|keep me (awake|up|going)|stay awake|energi[sz]|energy|sleepy|boost/,d:'cold brew',why:'nice and strong',negd:'latte',negwhy:'mild and creamy'},
 {id:'light',re:/\blight(er)?\b|mild|gentle|soft|easy/,d:'green tea',why:'light and gentle'}
];
const GENOBJ=/\b(something|anything|drinks?|thing|things|one|ones|option|options|stuff|kind|type)\b/;
const ATTR_PERS=["Ooh, try the {d}! It's {why}.","Um, maybe the {d}? It's… {why}, I think.","{D}. It's {why}.","The {d}. {Why}. Trust me, I'm a professional. Sort of.","Oh, the {d}, honey. It's {why}. You'll love it."];
function attrRec(n){
  n=n.replace(/\blight ice\b|\bgo light on\b|\bextra (hot|ice)\b|\bno ice\b|\bless ice\b/g,' ');
  if(/\b(is|are) (it|that|this|the [a-z ]+) (pretty |very |really |too |so )?(sweet|strong|hot|cold|light|bitter)\b/.test(n))return null;
  const wc=wordsOf(n).length;
  if(!GENOBJ.test(n)&&!/\b(ideas?|suggest(ion)?s?|recommend)/.test(n)&&wc>3)return null;
  const pi=pidx(S.pid);let hit=null,all=[];
  for(const a of ATTRS){if(!a.re.test(n))continue;const neg=isNegAt(n,a.re);if(a.need==='neg'&&!neg)continue;all.push([a,neg]);}
  if(!all.length)return null;
  const has=id=>all.find(x=>x[0].id===id&&!x[1]);
  let [a,neg]=all[0];let d,why;
  if(has('cold')&&has('sweet')){d='iced caramel macchiato';why='sweet and cold'}
  else if(has('cold')&&has('strong')){d='cold brew';why='cold and strong'}
  else if(has('cold')&&has('fruity')){d='strawberry smoothie';why='fruity and cold'}
  else if(has('warm')&&has('sweet')){d='hot chocolate';why='warm and sweet'}
  else if(a.need==='neg'){d=a.d;why=a.why}
  else if(neg){if(!a.negd)return null;d=a.negd;why=a.negwhy}
  else{d=a.d==='ICED'?ICED_PICK[pi]:a.d;why=a.why}
  if(a.need==='neg'&&!neg)return null;
  return {d,why,text:ATTR_PERS[pi].replace('{d}',d).replace('{D}',cap(d)).replace('{why}',why).replace('{Why}',cap(why))};
}
const BYE=/\b(bye|gotta go|got to go|have to go|need to go|should go|see you|see ya|leave now|i'?m done|that'?s all)\b/;
async function nextTopic(){
  if(!S.topics.length){await say("Oh! My manager's looking at me. I'd better get back to work!");await endChat();return}
  await say(S.topics.shift());
}
async function endChat(){await say(P[S.pid].lines.end);S.free=false;await finish()}
async function handleFree(raw){
  const p=P[S.pid],pi=pidx(S.pid);const n=norm(raw);if(!n)return;
  S.log.push({who:'u',text:raw,st:'free'});markExpr();S.freeTurns++;koAttach(null);render();
  if(BYE.test(n)&&!(isQuestion(raw,n)&&qText(raw))){await endChat();return}
  const isQ=isQuestion(raw,n);const qt=qText(raw);const intent=matchIntent(qt||n);
  const st=statementReact(n);
  if(BACK.test(n)&&!(intent&&intent.r)){await say(st||pick(p.react.chat1.concat(p.react.chat2)));await say(FREE_BACK[pi])}
  else if(isCompli(n)&&!isQ)await say(COMPLI_R[pi]);
  else if(isQ&&intent&&intent.r)await say(irText(intent,pi,qt||n));
  else if(isQ&&genQ(qt))await say(genQ(qt));
  else if(isQ){flag('unsure');await say(UNSURE[pi])}
  else{const af=!st&&!S.lastAct?actFollow(raw,n,pi):null;if(af){S.lastAct=true;await say(af);return}S.lastAct=false;await say(fill(st||pick(p.react.chat1.concat(p.react.chat2))))}
  await nextTopic();
}
async function handle(raw){
  if(S.free)return handleFree(raw);
  const st=STAGES[S.idx], p=P[S.pid], pi=pidx(S.pid);
  const n=norm(raw); if(!n)return;
  S.lastRaw=raw;
  S.log.push({who:'u',text:raw,st});markExpr();S.hintNote=false;koAttach(st);render();
  const wc=wordsOf(n).length;
  const isQ=isQuestion(raw,n);
  if(REPEAT.test(n)&&wc<=6){flag('repeat');const lq=[...S.log].reverse().find(m=>m.who==='b'&&/\?$/.test(m.text));await say("Sure! "+(lq?lq.text:fill(p.lines[st])));return}
  const ok=stageMatch(st,n,raw,isQ);
  const qt=qText(raw);
  const qIntent=qt?matchIntent(qt):null;
  const intent=(qt&&matchIntent(qt))||matchIntent(n);
  const back=BACK.test(n)||(intent&&intent.id==='howareyou');
  if(ok){
    S.fails[st]=0;flag('ok');
    let sc=scoreTurn(raw,n,st,S.lastB);
    if(S.asked[st]&&sc<60)sc=60;
    record(st,S.asked[st]?S.asked[st]+' / '+raw:raw,sc);
    captureSlots(st,n);
    if(st==='close'){
      if(isQ&&qIntent&&qIntent.r&&qIntent.id!=='thanks'){await say(irText(qIntent,pi,qt));await say(pick(["Anyway, enjoy your drink!","Enjoy!","Have a good one!"]))}
      else await say(isCompli(n)?COMPLI_R[pi]:LUCK.test(n)?LUCK_R[pi]:GOODLUCK.test(n)?GOODLUCK_R[pi]:COMEBACK.test(n)?COMEBACK_R[pi]:back||/you (too|2|to)$|have a|take care|good one|hope|cheers|\bta\b|stay (warm|dry|safe)/.test(n)?p.back.close:pick(["Of course!","Anytime!","You're welcome!"]));
      await advance();return;
    }
    let r=CHAT.has(st)?statementReact(n):null;
    const offScript=(st==='chat1'||st==='chat2')&&!S.followed[st]&&!p.expect[st].test(n.replace(/\?/g,''));
    if(st==='order'&&iRe('wrong').re.test(n))r=iRe('wrong').r[pi];
    if(!r&&CHAT.has(st)&&!isQ&&!S.followed[st]&&!S.rush&&!(st==='greet'&&isNeg(n))){const af=actFollow(raw,n,pi);if(af){S.followed[st]=true;flag('topic');await say(af);return}}
    if(!r&&offScript&&!NEGANS.test(n))r=NEUTRAL[pi];
    if(sc===10&&CHAT.has(st)&&!S.followed[st]&&!S.rush&&!offScript&&!(st==='greet'&&isNeg(n))&&!(st==='greet'&&isNeg(n))){S.followed[st]=true;await say(r||(st!=='greet'&&NEGANS.test(n)?FOLLOW_NEG[pi]:p.follow[st]));return}
    if(!r&&st!=='greet'&&CHAT.has(st)&&NEGANS.test(n))r=REACT_NO[pi];
    if(!r)r=st==='greet'?pick(isNeg(n)?p.react.greetNeg:p.react.greetPos):pick(p.react[st]);
    await say(fill(r));
    if(st==='order'&&S.slots.drinks)await say(pick(["So that's "+listJoin(S.slots.drinks.map(aOf))+". Got it!","Okay, "+['','one','two','three','four'][S.slots.drinks.length]+" drinks: "+listJoin(S.slots.drinks.map(aOf))+"."]));
    if(st==='order'&&S.food)await say("And a "+S.food+", got it!");
    if(back)await say(p.back[st]||p.back.greet);
    else if(isQ&&qIntent&&qIntent.r&&qIntent.id!=='howsay')await say(irText(qIntent,pi,qt));
    else if(isQ&&qt&&genQ(qt))await say(genQ(qt));
    else if(isQ&&qt&&wordsOf(qt).length>=3&&!RHET.test(qt)&&!(qIntent&&qIntent.id==='howsay')){flag('ok-unsure');await say(UNSURE[pi])}
    await advance();return;
  }
  if(st==='order'&&!findDrink(n)&&!(S.offer&&YES.test(n))){const ar=attrRec(n);if(ar){S.asked[st]=raw;flag('intent:attr');S.offer=ar.d;S.lastRec=ar.d;await say(ar.text);await say(pick(['Want to try it?','Should I make you one?','Want one?']));return}}
  if(st==='order'&&S.offer&&REJECT.test(n)&&!findDrink(n)){S.offer=null;S.asked[st]=raw;flag('intent:reject');await say(pick(['No problem! ','Sure! ','Okay! '])+AVAIL_NONE[pi]);return}
  if(st==='order'&&UNDECIDED.test(n)&&!findDrink(n)){
    S.asked[st]=raw;flag('intent:undecided');S.lastRec=REC[pi];S.offer=REC[pi];
    await say(iRe('recommend').r[pi]);await say(pick(['Want to try it?','Should I make you one?']));return;
  }
  if(st==='order'&&isQ&&AVAIL.test(n)&&!(intent&&intent.id==='teakinds')&&(findDrink(n)||!(intent&&intent.r))){
    S.asked[st]=raw;flag('avail');const d=findDrink(n);
    if(d){S.offer=d;await say(AVAIL_R[pi].replace('{d}',d).replace(/^./,c=>c.toUpperCase()))}
    else await say(AVAIL_NONE[pi]);
    return;
  }
  const QONLY=['grocery','trails','far','blive','bread','comedy','petname','garden','nameok','drinksize','whatsin','isgood','teakinds','sizehelp','weather','sports','music','pets','hobby','school','directions','eat','sights','favorite','city','line','busy','time'];
  if(intent&&(isQ||(intent.r&&!QONLY.includes(intent.id))||intent.id==='howareyou')){
    S.asked[st]=raw;flag('intent:'+intent.id);
    if(intent.id==='recommend'&&/\b(ice|iced|cold|cool)\b/.test(n)){S.lastRec=ICED_PICK[pi];if(st==='order')S.offer=ICED_PICK[pi];await say(ICED_REC[pi]);if(st==='order'){await say(pick(['Want to try it?','Should I make you one?']));return}await reask(st,raw);return}
    if(intent.id==='recommend'&&st==='order'&&S.offer){await say(pick(['Honestly, still the '+S.offer+'! Want one?','My pick is still the '+S.offer+'. Should I make it?']));return}
    if(intent.id==='recommend'){S.lastRec=REC[pi];if(st==='order'){S.offer=REC[pi];await say(intent.r[pi]);await say(pick(['Want to try it?','Should I make you one?']));return}}
    if(intent.offer&&st==='order'){const d=intent.offer==='*'?findDrink((qt||n).replace(/.*\bwith\b/,'')):intent.offer;if(d){S.offer=d;S.lastRec=d;await say(irText(intent,pi,qt||n));await say(pick(['Want one?','Want to try it?','Should I make you one?']));return}}
    if(intent.id==='strong'&&st==='order'){S.offer='cold brew';S.lastRec='cold brew';await say(intent.r[pi]);await say(pick(['Want one?','Should I make you one?']));return}
    const d=findDrink(qt||n);
    const fp=(qt||n).match(FOOD);
    if(/how much|price|cost/.test(qt||n)&&fp){await say(cap(fp[0])+'? That one is three fifty.')}
    else if(intent.id==='whatsin'&&d){await say(DESC_PRE[pi]+(DESC[d]||intent.r[pi]))}
    else await say(intent.r?irText(intent,pi,qt||n):(p.back[st]||p.back.greet));
    if(st==='order'&&d&&['whatsin','isgood','price','sweet','drinksize','temp','nosugar','diet'].includes(intent.id)){S.offer=d;await say(pick(['Want to try it?','Want one?','Should I make you one?']));return}
    await reask(st,raw);return;
  }
  if(isQ&&wc>=3){
    S.asked[st]=raw;const g=genQ(qt);flag(g?'genq':'unsure');
    await say(g||UNSURE[pi]);
    await reask(st,raw);return;
  }
  S.fails[st]=(S.fails[st]||0)+1;
  flag(S.fails[st]>=2?'giveup':'clarify');
  if(S.fails[st]>=2&&CHAT.has(st)&&!isQ){flag('ok-short');record(st,raw,10);await say(NEUTRAL[pi]);await advance();return}

    await say(p.giveup);await advance();return;
  }
  S.hintsOpen=true;S.hintNote=true;
  await say(pick(p.clarify));
}

function bindLang(){app.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>setLang(b.dataset.lang))}

function start(pid){
  S={sid:'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),startAt:Date.now(),pid,idx:0,log:[],turns:[],best:{},fails:{},followed:{},asked:{},offer:null,lastRec:null,looked:{},gloss:null,hk:null,reasks:{},free:false,ended:false,freeTurns:0,topics:FREE_TOPICS.slice().sort(()=>Math.random()-.5),ph:'',slots:{drink:'latte',size:'medium',name:'friend'},busy:false,done:false,hintsOpen:false,hintNote:false,lastB:''};
  render();
  say(P[pid].lines.greet).then(()=>{const i=document.getElementById('say');i&&i.focus()});
}
function hintKey(st){return CHAT.has(st)&&st!=='greet'?'chat':st}
function renderChat(){
  const p=P[S.pid], st=STAGES[Math.min(S.idx,STAGES.length-1)];
  const draft=(document.getElementById('say')||{}).value||'';
  const hk=S.free?'chat':hintKey(st);
  app.innerHTML=`
  <div class="bar">
    <div class="who"><span class="eyebrow">${p.role}</span><h2>${p.name}</h2></div>
    <button class="btn" id="quit">처음으로</button>
  </div>
  <div class="steps" aria-label="진행 단계">${STAGES.map((s,i)=>`<span class="${i<S.idx?'done':i===S.idx&&!S.done?'on':''}">${STAGE_KO[s]}</span>`).join('')}</div>
  <div class="log" id="log" aria-live="polite">
    ${S.log.map((m,i)=>`<div class="msg ${m.who}">${m.who==='b'?glossHTML(m.text):esc(m.text)}${m.orig?`<small class="kofrom">${esc(m.orig)}<br>${m.pairs.map(([k,e])=>esc(k)+' → '+esc(e)).join(' · ')}${m.st&&m.st!=='free'?' (−'+PENALTY*m.pairs.length+'점)':''}</small>`:''}${m.used?`<small class="kofrom">표현 '${esc(m.used)}'을(를) 사용했어요. 잘했어요</small>`:''}${m.who==='b'?`<button class="spk" data-say="${i}" aria-label="듣기">듣기</button>`:''}${S.gloss&&S.gloss.i===i?`<div class="glbox"><b>${esc(S.gloss.k)}</b> ${glossBody(S.gloss.k)}<div class="row"><button data-gsay="${esc(S.gloss.k)}">발음</button><button data-gsave="${esc(S.gloss.k)}">${savedList().some(x=>x.en===S.gloss.k)?'저장됨':'저장'}</button><span class="muted">${S.free||S.done?'추가 대화라 감점 없음':`뜻을 볼 때마다 이 단계 점수 −${PENALTY}`}</span></div></div>`:''}</div>`).join('')}
    ${S.busy?`<div class="typing">${p.name} is typing…</div>`:''}
  </div>
  <div class="composer">
    ${S.done?`<button class="btn primary" id="toReceipt">영수증 받기</button>`:S.ended&&!S.busy?`<div class="row"><button class="btn primary" id="more">더 이야기하기</button><button class="btn" id="stop">대화 마치기</button></div>`:S.ended?'':`
    ${S.hintsOpen?`<div class="hints">
      ${S.hintNote?`<p class="note">${LANG==='ko'?'바리스타가 잘 못 알아들었어요. 아래 표현을 참고해서 다시 말해 보세요.':"The barista didn't catch that. Try again with one of these."}</p>`:''}
      ${(S.hk&&QH[S.hk]?QH[S.hk].h:HINTS[hk]).map(([en,ko,enx])=>`<div class="chip"><div class="t"><b>${esc(en)}</b><small>${esc(LANG==='ko'?ko:enx)}</small></div><div class="acts"><button data-use="${esc(en)}">쓰기</button><button data-save="${esc(en)}" data-ko="${esc(ko)}">${savedList().some(x=>x.en===en)?'저장됨':'저장'}</button></div></div>`).join('')}
    </div>`:''}
    <div id="kofind" class="hints" hidden></div>
    ${S.expr&&!S.done&&S.ph&&S.ph.startsWith('위 표현')?`<div class="muted" style="font-size:13px;margin:0 0 6px;line-height:1.5">${esc(S.expr.ko||'')}<br>표현 : <b>${esc(S.expr.p)}</b></div>`:''}
    <form id="f"><input id="say" autocomplete="off" placeholder="${esc(S.ph||'예: 영어로 편하게 대답해 보기')}" value="${esc(draft)}" ${S.busy?'disabled':''}><button class="btn primary" ${S.busy?'disabled':''}>보내기</button></form>
    <div class="row">${S.free?`<button class="btn" id="stop" style="font-size:.85rem">대화 마치기</button>`:''}<button class="btn" id="hint" style="font-size:.85rem">${S.hintsOpen?'힌트 닫기':'힌트 보기'}</button>${langToggle()}</div>`}
  </div>`;
  const log=document.getElementById('log');log.lastElementChild&&log.lastElementChild.scrollIntoView({block:'nearest'});
  app.querySelector('#quit').onclick=()=>{logWrite();S=null;render()};
  if(S.done){app.querySelector('#toReceipt').onclick=()=>{S.receipt=true;render();window.scrollTo(0,0)};return}
  const stopB=app.querySelector('#stop');if(stopB)stopB.onclick=()=>{if(S.busy)return;S.ended=false;S.free=false;endChat()};
  if(S.ended){const m=app.querySelector('#more');if(m)m.onclick=()=>{S.ended=false;S.free=true;S.hintsOpen=false;nextTopic().then(()=>{const i=document.getElementById('say');i&&i.focus()})};return}
  const sayEl=document.getElementById('say');
  sayEl.addEventListener('input',()=>koFind(sayEl.value));
  if(draft)koFind(draft);
  app.querySelector('#f').onsubmit=e=>{e.preventDefault();if(S.busy)return;const v=document.getElementById('say').value.trim();if(!v)return;let sendV=v;S.pendingKo=null;if(/[가-힣ㄱ-ㅎㅏ-ㅣ]/.test(v)){const c=koConvert(v);if(!c.ok||!/[a-z]/i.test(c.text)){koFind(v,true);return}sendV=c.text;S.pendingKo={orig:v,pairs:c.pairs}}document.getElementById('say').value='';const kb=document.getElementById('kofind');if(kb){kb.hidden=true;kb.innerHTML=''}handle(sendV).then(()=>{logSave();const i=document.getElementById('say');i&&i.focus()})};
  app.querySelector('#hint').onclick=()=>{S.hintsOpen=!S.hintsOpen;render()};
  app.querySelectorAll('[data-use]').forEach(b=>b.onclick=()=>{const i=document.getElementById('say');i.value=b.dataset.use.replace(/ \.\.\.|\.\.\./,' ');i.focus()});
  app.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>saveChunk(b.dataset.save,b.dataset.ko));
  app.querySelectorAll('.gl').forEach(b=>b.onclick=()=>{const i=+b.closest('.msg').querySelector('[data-say]').dataset.say;const k=b.dataset.k;
    if(S.gloss&&S.gloss.i===i&&S.gloss.k===k){S.gloss=null;render();return}
    S.gloss={i,k};
    if(!S.free&&!S.done&&!S.ended){const st=STAGES[S.idx];S.looked[st]=S.looked[st]||[];if(!S.looked[st].includes(k))S.looked[st].push(k)}
    if(!GL[k]&&!CONTR[k]&&!(DICT[k]&&!DICT[k].err)){delete DICT[k];lookupWord(k).then(()=>{if(S&&S.gloss&&S.gloss.k===k)render()})}
    render()});
  app.querySelectorAll('.gl.w').forEach(b=>{if(S.gloss&&b.dataset.k===S.gloss.k&&b.closest('.msg')&&+b.closest('.msg').querySelector('[data-say]').dataset.say===S.gloss.i)b.classList.add('on')});
  app.querySelectorAll('[data-gsay]').forEach(b=>b.onclick=()=>{try{const u=new SpeechSynthesisUtterance(b.dataset.gsay);u.lang='en-US';u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}});
  app.querySelectorAll('[data-gsave]').forEach(b=>b.onclick=()=>saveChunk(b.dataset.gsave,glossKo(b.dataset.gsave)));
  app.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>{try{const u=new SpeechSynthesisUtterance(S.log[+b.dataset.say].text);u.lang='en-US';u.rate=.95;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}});
  bindLang();
}
function koFind(v,blocked){
  const box=document.getElementById('kofind');if(!box)return;
  const runs=(v.match(HANGUL)||[]).map(x=>x.trim()).filter(Boolean);
  if(!runs.length){box.hidden=true;box.innerHTML='';return}
  let html=blocked?`<p class="note">이 한국어는 자동으로 바꿀 수 없어요. 아래에서 영어 표현을 골라 바꾼 뒤 보내 주세요. (아는 단어는 한국어로 써도 자동으로 영어로 바뀌고, 한 단어마다 −${PENALTY}점)</p>`:`<p class="note">이 표현을 찾으셨나요?</p>`;
  for(const r of runs){
    const m=findKo(r);
    if(m.length){html+=m.map(e=>`<div class="chip"><div class="t"><b>${esc(e.en)}</b><small>${esc(e.ko)} · ${esc(e.ex)}</small></div><div class="acts"><button data-ins="${esc(r)}" data-en="${esc(e.en.split(' / ')[0])}" data-ko="${esc(e.ko)}">넣기</button><button data-ex="${esc(e.ex)}" data-en="${esc(e.en)}" data-ko="${esc(e.ko)}">예문 쓰기</button></div></div>`).join('')}
    else{const q=encodeURIComponent(r);html+=`<div class="chip"><div class="t"><b>“${esc(r)}”</b><small>표현 사전에 없어요. 사전에서 찾아보거나, 아는 말로 돌려 말해 보세요: “I don't know the word, but it's like...”</small></div><div class="acts"><a class="btnlink" href="https://en.dict.naver.com/#/search?query=${q}" target="_blank" rel="noopener">네이버 사전</a><a class="btnlink" href="https://papago.naver.com/?sk=ko&tk=en&st=${q}" target="_blank" rel="noopener">파파고</a></div></div>`}
  }
  box.innerHTML=html;box.hidden=false;
  const inp=document.getElementById('say');
  box.querySelectorAll('[data-ins]').forEach(b=>b.onclick=()=>{inp.value=inp.value.replace(b.dataset.ins,b.dataset.en).replace(/\s+/g,' ');saveChunk2(b.dataset.en,b.dataset.ko);koFind(inp.value);inp.focus()});
  box.querySelectorAll('[data-ex]').forEach(b=>b.onclick=()=>{inp.value=b.dataset.ex;saveChunk2(b.dataset.en,b.dataset.ko);koFind(inp.value);inp.focus()});
}
function saveChunk2(en,ko){const l=savedList();if(!l.some(x=>x.en===en)){l.unshift({en,ko,at:Date.now()});store.set('stc.saved',l)}}
function renderReceipt(){
  const p=P[S.pid];
  const total=STAGES.reduce((a,s)=>a+adj(s),0);
  const T=TIPS[LANG], TN=TIER_NAME[LANG];
  const model=s=>p.model[s]||MODEL[s];
  const now=new Date();
  app.innerHTML=`
  <header style="display:flex;flex-direction:column;gap:6px"><span class="eyebrow">Your receipt</span><h1>오늘의 대화</h1><p class="muted">단계마다 가장 잘한 답 하나로 계산했습니다. 다른 사람과 비교하지 않고, 내 지난 기록과만 비교합니다.</p></header>
  <div class="receipt">
    <div class="hd"><b>SMALL TALK CAFÉ</b><span>barista: ${p.name.toUpperCase()} (${p.role})</span><span>${now.toLocaleDateString('ko-KR')} ${now.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}</span></div>
    <div class="dash"></div>
    ${STAGES.map(s=>{const b=S.best[s]||{text:'—',score:0};const lk=S.looked[s]?S.looked[s].length:0;return `<div class="line">
      <div class="top"><span>${LANG==='ko'?STAGE_KO[s]:STAGE_EN[s]}</span><span class="tier s${b.score}">${TN[b.score]} ${lk?`${b.score} − ${lk*PENALTY} = ${adj(s)}`:b.score}</span></div>
      ${lk?`<div class="tip">${LANG==='ko'?'뜻 보기':'Looked up'} ${lk}${LANG==='ko'?'회':'x'}: ${esc(S.looked[s].join(', '))}</div>`:''}
      <div class="said">“${esc(b.text)}”</div>
      ${b.score<100?`<div class="tip">${b.score>0&&STAGE_TIP[LANG][s]?STAGE_TIP[LANG][s]:T[b.score]}</div><div class="model">${esc(model(s))}</div>`:''}
    </div>`}).join('<div class="dash"></div>')}
    ${(()=>{const fx=fixesFor(S.log.filter(m=>m.who==='u').map(m=>m.text));return fx.length?`<div class="dash"></div><div class="line"><div class="top"><span>${LANG==='ko'?'표현 다듬기':'Polish your English'}</span></div>${fx.map(({f,t})=>`<div class="said">“${esc(t)}”</div><div class="tip">${esc(LANG==='ko'?f.ko:f.en)}</div><div class="model">${esc(f.fix)}</div>`).join('')}</div>`:''})()}
    <div class="dash"></div>
    <div class="total"><span>TOTAL</span><span class="num">${total} / 700</span></div>
    ${S.freeTurns?`<div class="top" style="display:flex;justify-content:space-between"><span>${LANG==='ko'?'추가 대화 (점수 없음)':'Extra chat (not scored)'}</span><span class="num">${S.freeTurns} ${LANG==='ko'?'번 말함':'turns'}</span></div>`:''}
    <div class="hd muted"><span>${drinkLabel()} · for ${S.slots.name}</span><span>Thank you! Come again.</span></div>
  </div>
  <div class="row"><button class="btn primary" id="again">${p.name}와 다시 하기</button><button class="btn" id="home">다른 바리스타 고르기</button></div>`;
  app.querySelector('#again').onclick=()=>start(S.pid);
  app.querySelector('#home').onclick=()=>{S=null;render()};
}
function render(){if(!S)renderStart();else if(S.receipt)renderReceipt();else renderChat()}
render();
</script>
