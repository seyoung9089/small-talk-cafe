{const t=store.get('stc.theme',null);if(t==='dark'||t==='light')document.documentElement.dataset.theme=t}

function pidx(pid){return PIDS.indexOf((P[pid]&&P[pid].base)||pid)}
const dayNum=(()=>{const d=new Date();return Math.floor((d.getTime()-d.getTimezoneOffset()*60000)/86400000)})();
function todays(){return GROUPS.map((g,i)=>g[(dayNum+i)%g.length])}

/* ---------- scoring rules (see design doc: 10 / 30 / 60 / 100) ---------- */
function wordsOf(n){return (n.match(/[a-z']+/g)||[])}
function scoreTurn(raw,n,stage,lastB){
  const w=wordsOf(n), wc=w.length;
  const polite=/\b(please|can i (get|have)|could i|i'?d like|i would like|thank)/.test(n);
  const connector=/\b(and|because|but|so|actually|just|really|kind of|though|since|also|too|finally|today|this morning)\b/.test(n);
  const added=wc>=6||(connector&&wc>=4)||(!CHAT.has(stage)&&polite);
  const asked=/\?/.test(raw)||QSTART.test(n)||BACK.test(n)||/\b(how about|what about) /.test(n);
  const content=new Set(wordsOf((lastB||'').toLowerCase()).filter(x=>x.length>=5));
  const overlap=w.some(x=>content.has(x));
  const reacted=/\b(oh|nice|cool|wow|really|that'?s|sounds|haha|lol|awesome|no way|love|aw+|ha|great)\b/.test(n)||overlap;
  if(asked&&added&&(reacted||wc>=10))return 100;
  if(asked)return 60;
  if(added)return 30;
  return 10;
}

function fixesFor(lines){const out=[];for(const t of lines){const n=norm(t);for(const f of FIXES){if(f.re.test(n)&&!out.some(o=>o.f===f))out.push({f,t})}}return out}

  if(st!=='free'&&(fu==='react'||fu==='really')&&stageMatch(st,n,raw,isQ))return false;

async function topicBack(st,raw,n,qt,isQ){
  if(!isQ||segsOf(raw).some(x=>!isQSeg(x))||!/\b(you|your|u|yours)\b/.test(n))return false;
  const ts=st==='free'?topicOf(S.q&&S.q.t):(topicOf(P[S.pid].lines[st])||topicOf(S.q&&S.q.t));const tq=topicOf(qt||n);

}

    ${h.length?`<div class="dash"></div><h3>오늘 ${S.scene?esc(S.scene.who):'스몰메이트'}가 쓴 원어민 표현</h3><ul class="list">${h.map(([k,ko])=>`<li><span class="en">${esc(k)}</span><span class="muted" style="text-align:right">${esc(ko)}</span></li>`).join('')}</ul>`:(S.lv||2)<3?`<p class="muted" style="font-size:.82rem">Lv3 현지인부터는 스몰메이트가 이런 표현을 직접 섞어 말해요.</p>`:''}

document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-nsave]');if(b){saveChunk2(b.dataset.nsave,b.dataset.nko);b.textContent='저장됨'}});

/* ================= 구글 로그인 + 기록 동기화 (Firebase 무료 플랜) ================= */
/* 로그인은 선택입니다. 로그인하지 않아도 레벨·기록은 이 기기(localStorage)에 저장됩니다.
   로그인하면 이 기기 기록과 계정 기록을 합쳐(같은 대화는 한 번만) 다른 기기에서도 이어집니다.
   아래 값은 Firebase 콘솔 > 프로젝트 설정 > 내 앱 > 웹 앱의 'firebaseConfig'를 그대로 붙여 넣는 곳입니다.
   웹 앱 설정값은 원래 공개되는 값이라 여기 적어도 괜찮습니다(비밀키 아님). 접근은 Firestore 보안 규칙이 막아 줍니다. */
const FIREBASE_CONFIG=null;
const FB_VER='10.12.2';
const AUTH={on:!!FIREBASE_CONFIG,ready:false,user:null,busy:false,err:'',sync:''};
let FB=null;   // {signIn, signOut, load(uid), save(uid,data)}
function mergeGames(a,b){const m=new Map();[...(a||[]),...(b||[])].forEach(g=>{if(g&&g.at&&!m.has(g.at))m.set(g.at,g)});return [...m.values()].sort((x,y)=>x.at-y.at)}
function mergeMem(a,b){a=a||{};b=b||{};const facts={};for(const k of new Set([...Object.keys(a.facts||{}),...Object.keys(b.facts||{})])){const x=(a.facts||{})[k],y=(b.facts||{})[k];facts[k]=!x?y:!y?x:(x.at||0)>=(y.at||0)?x:y}
  const visits={};for(const k of new Set([...Object.keys(a.visits||{}),...Object.keys(b.visits||{})]))visits[k]=Math.max((a.visits||{})[k]||0,(b.visits||{})[k]||0);const slots={};for(const k of new Set([...Object.keys(a.slots||{}),...Object.keys(b.slots||{})])){const x=(a.slots||{})[k],y=(b.slots||{})[k];slots[k]=!x?y:!y?x:(x.at||0)>=(y.at||0)?x:y}return {name:a.name||b.name||'',facts,visits,slots}}
function mergeDays(a,b){const o=Object.assign({},a||{});for(const k in (b||{}))o[k]=Math.max(o[k]||0,b[k]);return o}
function syncData(extra){return Object.assign({name:AUTH.user.name||'',photo:AUTH.user.photo||'',talkLv:store.get('stc.talkLv',null),mem:store.get('stc.mem',null),days:store.get('stc.days',{}),rotN:store.get('stc.rotN',0),updated:Date.now()},extra)}
function mergeSaved(a,b){const out=[];[...(a||[]),...(b||[])].forEach(x=>{if(x&&x.en&&!out.some(y=>y.en===x.en))out.push(x)});return out.sort((x,y)=>(y.at||0)-(x.at||0))}
async function syncNow(){
  if(!FB||!AUTH.user)return;AUTH.sync='동기화 중…';rerenderIdle();
  try{const remote=await FB.load(AUTH.user.uid)||{};
    const games=mergeGames(gamesList(),remote.games),saved=mergeSaved(savedList(),remote.saved);
    store.set('stc.games',games);store.set('stc.saved',saved);
    store.set('stc.mem',mergeMem(store.get('stc.mem',null),remote.mem));store.set('stc.days',mergeDays(store.get('stc.days',{}),remote.days));store.set('stc.rotN',Math.max(store.get('stc.rotN',0),remote.rotN||0));
    if(remote.talkLv&&!store.get('stc.talkLv',null))store.set('stc.talkLv',remote.talkLv);
    await FB.save(AUTH.user.uid,syncData({games,saved}));
    AUTH.sync='저장됨 · '+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
  }catch(e){AUTH.sync='동기화하지 못했습니다. 인터넷 연결을 확인해 주세요. (기록은 이 기기에 안전하게 남아 있어요)'}
  rerenderIdle();
}
function rerenderIdle(){if(!S||S.receipt)render()}   // 대화 중에는 화면을 다시 그리지 않음
async function fbInit(){
  if(window.STC_FB_TEST){FB=window.STC_FB_TEST;AUTH.on=true}   // 시험용 가짜 로그인
  else if(FIREBASE_CONFIG){
    try{const base='https://www.gstatic.com/firebasejs/'+FB_VER+'/';
      const [A,U,F]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-firestore.js')]);
      const fapp=A.initializeApp(FIREBASE_CONFIG),auth=U.getAuth(fapp),db=F.getFirestore(fapp);
      FB={onUser:cb=>U.onAuthStateChanged(auth,u=>cb(u?{uid:u.uid,name:u.displayName,photo:u.photoURL}:null)),
        signIn:()=>U.signInWithPopup(auth,new U.GoogleAuthProvider()),
        signOut:()=>U.signOut(auth),
        load:async uid=>{const d=await F.getDoc(F.doc(db,'users',uid));return d.exists()?d.data():null},
        save:(uid,data)=>F.setDoc(F.doc(db,'users',uid),data)};
    }catch(e){AUTH.err='로그인 기능을 불러오지 못했습니다. 잠시 뒤 새로고침해 주세요.';AUTH.ready=true;rerenderIdle();return}
  }else{AUTH.ready=true;return}
  FB.onUser(u=>{AUTH.user=u;AUTH.ready=true;AUTH.busy=false;if(u)syncNow();else{AUTH.sync='';rerenderIdle()}});
}
async function signIn(){if(!FB||AUTH.busy)return;AUTH.busy=true;AUTH.err='';render();
  try{await FB.signIn()}catch(e){const c=(e&&e.code)||'';AUTH.busy=false;
    AUTH.err=/popup-closed|cancelled-popup/.test(c)?'로그인 창이 닫혔어요. 다시 눌러 주세요.':/popup-blocked/.test(c)?'팝업이 막혔어요. 브라우저 주소창의 팝업 허용을 켜고 다시 눌러 주세요.':/unauthorized-domain/.test(c)?'이 주소는 아직 로그인 허용 목록에 없어요. (Firebase 승인된 도메인 확인 필요)':'로그인하지 못했어요. 카카오톡·인스타그램 안에서 열었다면 크롬이나 사파리로 열어 주세요.';render()}}
async function signOutNow(){if(!FB||!AUTH.user)return;
  /* 같이 쓰는 컴퓨터일 수 있으니, 계정에 저장이 끝난 뒤 이 기기의 기록을 지웁니다(계정에는 그대로 남음) */
  let ok=false;try{await FB.save(AUTH.user.uid,syncData({games:gamesList(),saved:savedList()}));ok=true}catch(e){}
  if(!ok){AUTH.err='계정에 저장하지 못해서 로그아웃을 멈췄어요. 인터넷 연결을 확인하고 다시 눌러 주세요.';render();return}
  try{await FB.signOut()}catch(e){}
  ['stc.games','stc.saved','stc.history','stc.talkLv','stc.mem','stc.days','stc.rotN'].forEach(k=>{try{localStorage.removeItem(k)}catch(e){}});store.set('stc.games',[]);
  AUTH.user=null;AUTH.sync='';AUTH.err='';render()}
/* ---------- 내 프로필 ---------- */
let PROFILE=false;

  const recent=g.slice(-10).reverse();
  app.innerHTML=`
  <header style="display:flex;flex-direction:column;gap:8px">
    <div class="row" style="justify-content:space-between;flex-wrap:nowrap;align-items:flex-start"><span class="eyebrow" style="padding-top:6px">My profile</span><button class="btn themebtn" id="back">← 처음으로</button></div>
    <div class="me">
      ${u&&u.photo?`<img class="av" src="${esc(u.photo)}" alt="" referrerpolicy="no-referrer">`:`<span class="av">${u&&u.name?esc(u.name.slice(0,1)):'🙂'}</span>`}
      <div style="min-width:0"><h1 style="font-size:1.4rem">${u?esc(u.name||'이름 없음'):'게스트'}</h1><p class="muted" style="font-size:.85rem">레벨과 기록은 이 기기에 저장돼요.</p></div>
    </div>
  </header>
  <section class="panel">
    <div class="row" style="justify-content:space-between"><h3>로그인</h3>${u?`<button class="btn" id="logout">로그아웃</button>`:AUTH.on?`<button class="btn primary gbtn" id="login" ${AUTH.busy||!AUTH.ready?'disabled':''}>${AUTH.busy?'로그인 중…':'구글로 로그인'}</button>`:''}</div>
    <p class="muted" style="font-size:.85rem">${!AUTH.on?'구글 로그인은 아직 준비 중이에요. 그동안에도 레벨과 기록은 이 기기에 저장됩니다.':u?(AUTH.sync||'기록이 계정에 저장됩니다.')+' 다른 휴대폰이나 컴퓨터에서 로그인해도 레벨, 스몰메이트가 기억하는 내용, 출석 기록이 이어져요.':'로그인하면 지금 기기의 기록과 합쳐져서 다른 기기에서도 이어집니다. 기존 기록은 사라지지 않아요. 로그아웃하면 이 기기에서는 기록이 지워지고 계정에만 남습니다.'}</p>

  <section class="panel">

    <div class="prog">${xpBar(pr)}</div>
    <p class="muted" style="font-size:.85rem">${nextNeed(pr)}</p>
    <div class="row" style="justify-content:space-between;margin-top:4px"><span style="font-size:.85rem;font-weight:700">스몰메이트 말투</span><div class="seg" role="group" aria-label="스몰메이트 말투 난이도">${[1,2,3,4,5,6].filter(l=>l<=pr.lv).map(l=>`<button data-tl="${l}" aria-pressed="${tl===l}">Lv${l}</button>`).join('')}</div></div>
    <p class="muted" style="font-size:.85rem">Lv${tl} ${LV[tl].ko}: ${LV[tl].talk}${pr.lv>1?' 올라간 레벨까지는 언제든 골라서 연습할 수 있어요.':''}</p>
  </section>
  <section class="stats">
    <div><b class="num">${pr.n}</b><span>총 대화</span></div>
    <div><b class="num">${pr.best}</b><span>최고 점수</span></div>

  <section class="panel"><h3>연속 출석·배지</h3>${(()=>{const i=streakInfo(),b=badgesNow();return `<p style="font-size:.9rem"><b>${i.streak}</b>일 연속 · 오늘 ${i.today}/${DAILY_GOAL}판 · 하루 ${DAILY_GOAL}판 달성 ${i.goalDays}일 · 총 ${i.total}판</p>${b.length?`<p style="font-size:.88rem">${badgeNames(b).map(x=>`<span class="badge">${esc(x)}</span>`).join(' ')}</p>`:`<p class="muted" style="font-size:.85rem">첫 대화를 마치면 배지가 생겨요.</p>`}`})()}<p class="muted" style="font-size:.82rem">스몰메이트가 내 이름과 지난 대답을 기억해요(이 기기에 저장).</p></section>
  <section class="panel"><h3>오늘의 도전 표현</h3><p><b>${esc(chal.p)}</b> <span class="muted">${esc(chal.ko)}</span></p><p class="muted" style="font-size:.85rem">예: ${esc(chal.ex)} · 대화 중에 쓰면 +${CHAL_BONUS} XP</p></section>

  <section class="panel"><h3>레벨 안내</h3><ul class="list">${[1,2,3,4,5,6].map(l=>`<li style="flex-direction:column;gap:2px"><span>${lvBadge(l)} <span class="muted" style="font-size:.8rem">${l>1?`XP ${LV_XP[l]} + 최근 3번 평균 ${LV_AVG[l]}점 이상`:'처음 시작'}</span></span><span class="muted" style="font-size:.85rem">${LV[l].talk}</span></li>`).join('')}</ul></section>`;
  app.querySelector('#back').onclick=()=>{PROFILE=false;render();scrollTo(0,0)};
  const li=app.querySelector('#login');if(li)li.onclick=signIn;
  const lo=app.querySelector('#logout');if(lo)lo.onclick=signOutNow;

render();
fbInit();
</script>
